server {
    listen 80;

    # Docker embedded DNS — enables lazy resolution via $variables so nginx
    # starts even when Alfresco is not part of the active compose profile.
    resolver 127.0.0.11 ipv6=off valid=30s;

    root  /usr/share/nginx/html;
    index index.html;

    set $rag_upstream       rag-service:9091;
    set $alfresco_upstream  alfresco:8080;
    # The plugin host, which serves the connector, browse and selection endpoints. Opt-in `connector`
    # profile, so a variable rather than a literal: the resolver above looks it up per request, and this
    # container therefore starts and answers 502 on a stack without that profile.
    set $plugin_host_upstream plugin-batch-ingester:9096;

    # ---- API proxy -------------------------------------------------------

    # SSE chat stream: disable retry-on-error, extend timeout, no buffering
    location /api/rag/chat/stream {
        proxy_pass         http://$rag_upstream;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_pass_request_headers on;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/rag {
        proxy_pass         http://$rag_upstream;
        proxy_buffering    off;
        proxy_pass_request_headers on;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Operational status snapshot (rag-service). A sibling of /api/rag rather than a child, so the prefix
    # above does not cover it and it needs its own location. Without this the status screen got index.html
    # back when this container was reached on its own published port instead of through the stack proxy.
    location /api/status {
        proxy_pass         http://$rag_upstream;
        proxy_pass_request_headers on;
        proxy_hide_header  WWW-Authenticate;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- The plugin host's operator endpoints ----------------------------
    #
    # Mirrors the stack proxy's own locations, so this container on its published port behaves the same as
    # the proxy in front of it, and so `ng serve` behaves the same as both. Without these, a connector call
    # falls through to `location /` and the app is handed index.html where it expected JSON.
    #
    # WWW-Authenticate is stripped on each, as on /api/status: every ingester is default-deny, and a browser
    # that sees a Basic challenge raises its own native password box over the application.

    location /api/connectors {
        proxy_pass         http://$plugin_host_upstream;
        proxy_pass_request_headers on;
        proxy_hide_header  WWW-Authenticate;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The connector's own last-run summary, which is a different document from rag-service's /api/status
    # above. Same external path the stack proxy uses, for the same reason: /api/status is rag-service's.
    location /api/connector-status {
        proxy_pass         http://$plugin_host_upstream/api/status;
        proxy_pass_request_headers on;
        proxy_hide_header  WWW-Authenticate;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/browse {
        proxy_pass         http://$plugin_host_upstream;
        proxy_pass_request_headers on;
        proxy_hide_header  WWW-Authenticate;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/selection {
        proxy_pass         http://$plugin_host_upstream;
        proxy_pass_request_headers on;
        proxy_hide_header  WWW-Authenticate;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/sync is deliberately absent. Its backend depends on the request's sourceType, which is a map in
    # the stack proxy; duplicating that here would put the routing table in two places. Triggering a sync
    # from the UI therefore goes through the stack proxy.

    location /alfresco/ {
        proxy_pass         http://$alfresco_upstream;
        proxy_pass_request_headers on;
        proxy_set_header   Host $host;
    }

    location = /nuxeo {
        return 301 /nuxeo/;
    }

    location /nuxeo/ {
        # Static upstream — avoids Docker DNS resolution failure on Linux
        # where host.docker.internal is set via /etc/hosts, not DNS.
        proxy_pass         http://host.docker.internal:8081;
        proxy_pass_request_headers on;
        proxy_set_header   Host $host;
    }

    # ---- Angular SPA -----------------------------------------------------

    # Never cache the app shell so URL-substituted env vars take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Aggressively cache output-hashed static assets
    location ~* \.(js|css|woff2?|png|jpg|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All other paths: try static file, fall back to index.html (Angular router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
